<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111318" />

  <!-- Triángulo (arriba-izquierda) -->
  <polygon
    points="18,11 27,27 9,27"
    fill="none"
    stroke="#25D39E"
    stroke-width="3.6"
    stroke-linejoin="round"
  />

  <!-- Círculo (arriba-derecha) -->
  <circle
    cx="46"
    cy="19"
    r="8.5"
    fill="none"
    stroke="#FF5A6E"
    stroke-width="3.6"
  />

  <!-- Cruz / Equis (abajo-izquierda) -->
  <g stroke="#63A4FF" stroke-width="3.6" stroke-linecap="round">
    <line x1="12" y1="37" x2="24" y2="49" />
    <line x1="24" y1="37" x2="12" y2="49" />
  </g>

  <!-- Cuadrado (abajo-derecha) -->
  <rect
    x="37.5"
    y="34.5"
    width="17"
    height="17"
    rx="2.5"
    fill="none"
    stroke="#F28CFF"
    stroke-width="3.6"
    stroke-linejoin="round"
  />
</svg>
